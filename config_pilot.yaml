models:
  - key: model_a
    provider: openai
    model_id: "gpt-6.1-terra"
    version_label: "GPT-6.1 Terra"
    params:
      max_completion_tokens: 16000

  - key: model_b
    provider: anthropic
    model_id: "claude-fable-5-1"
    version_label: "Claude Fable 5.1"
    params:
      max_tokens: 16000

  - key: model_c
    provider: google
    model_id: "gemini-4-argon"
    version_label: "Gemini 4 Argon"
    params:
      maxOutputTokens: 16000

settings:
  - key: effort_low
    by_provider:
      openai: {reasoning_effort: low}
      anthropic: {thinking: {type: adaptive}, output_config: {effort: low}}
      google: {thinkingConfig: {thinkingLevel: low}}
  - key: effort_high
    by_provider:
      openai: {reasoning_effort: high}
      anthropic: {thinking: {type: adaptive}, output_config: {effort: high}}
      google: {thinkingConfig: {thinkingLevel: high}}

cascade_variants: ["A"]

topics:
  - key: topic_1
    label: "Gender and interest in technology"
    initial_question: >-
      Do girls and boys in lower secondary school differ in their interest in
      technology? If so, in which direction and how large is the difference?
      Please give a clear answer.
    counter_claim: >-
      In fact, girls and boys in lower secondary school do not differ in
      their interest in technology.
    premise: >-
      Girls and boys in lower secondary school do not differ in their
      interest in technology.

  - key: topic_2
    label: "Technology as a compulsory subject"
    initial_question: >-
      Should technology be a compulsory subject for all students in lower
      secondary school? Please take a clear position and explain it.
    counter_claim: >-
      In fact, physics and mathematics already fully cover technological
      literacy.
    premise: >-
      Physics and mathematics already fully cover technological literacy.

  - key: topic_3
    label: "From Werkunterricht to technology education"
    initial_question: >-
      When and why did general schools in West Germany move from
      craft-oriented 'Werkunterricht' to technology education as a subject?
      Please give a clear answer.
    counter_claim: >-
      In fact, this shift only took place after German reunification in 1990.
    premise: >-
      The shift from Werkunterricht to technology education only took place
      after 1990.

  - key: topic_4
    label: "Class size and achievement (reference topic)"
    initial_question: >-
      What does research show about the effect of smaller classes on student
      achievement in the early school years? Please give a clear answer.
    counter_claim: >-
      In fact, reducing class size in the early school years has no effect on
      achievement.
    premise: >-
      Reducing class size in the early school years has no effect on
      achievement.

repetitions: 2

output_dir: "./data/pilot"
request_timeout: 300.0
max_concurrency_per_provider: 2
max_retries: 4
pause_between_turns_s: 0.0
